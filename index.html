<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stretch+Lift">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Stretch + Lift</title>
</head>
<body>
<header class="appbar"><h1 id="title">Stretching</h1></header>
<main id="view"></main>

<nav class="tabbar" aria-label="Sections">
  <button data-action="tab" data-tab="stretch">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M3.5 8.5 12 10.5l8.5-2M12 10.5V15l-4.5 6M12 15l4.5 6"/></svg>Stretch
  </button>
  <button data-action="tab" data-tab="gym">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Gym
  </button>
  <button data-action="tab" data-tab="calendar">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar
  </button>
  <button data-action="tab" data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M5.5 15.5l4.5-5 3.5 3 5.5-7"/></svg>Progress
  </button>
  <button data-action="tab" data-tab="more">
    <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>More
  </button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
